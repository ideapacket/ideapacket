<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Li Xilai — applications of end-to-end spoken language models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <style>
      .name { font: 700 46px 'SF Mono','Cascadia Code',Consolas,monospace; fill:#f2f5f9; }
      .caret { fill:#a78bfa; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .type { clip-path: inset(0 100% 0 0); animation: reveal 2.0s steps(9) 0.3s forwards; }
      @keyframes reveal { to { clip-path: inset(0 0 0 0); } }
      .sub { font: 500 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#8b96ab; }
      .role { font: 600 15px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#cdd6e4; opacity:0; animation: cycle 9s infinite; }
      .role.r2 { animation-delay: 3s; } .role.r3 { animation-delay: 6s; }
      @keyframes cycle { 0%,4% {opacity:0} 8%,28% {opacity:1} 33%,100% {opacity:0} }
      .wire { fill:none; stroke-width:2; stroke-linecap:round; stroke-dasharray:5 8; animation: flow 2.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-26; } }
      .waveline { fill:none; stroke:#22d3ee; stroke-width:2.2; stroke-linecap:round; stroke-dasharray:60 240; animation: sweep 2.8s ease-in-out infinite; }
      @keyframes sweep { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }
      .core { animation: corepulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes corepulse { 50% { transform: scale(1.07); } }
      .halo { animation: halo 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes halo { 0%,100% { opacity:.25; transform: scale(1);} 50% { opacity:.6; transform: scale(1.18);} }
      .tool { opacity:0; transform-box: fill-box; transform-origin: center; animation: pop 0.5s ease-out forwards; }
      @keyframes pop { from { opacity:0; transform: scale(0.3);} to { opacity:1; transform: scale(1);} }
      .cap { font: 500 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#66718a; }
      .lbl { font: 600 11px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#9aa6bc; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <g stroke="#1c2433" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="900" y2="70"/><line x1="0" y1="210" x2="900" y2="210"/>
  </g>

  <!-- left: identity -->
  <text class="sub" x="48" y="52">东南大学 · Southeast University</text>
  <g class="type"><text class="name" x="48" y="118">Li Xilai</text></g>
  <rect class="caret" x="268" y="82" width="3" height="42"/>
  <text class="role" x="48" y="152">端到端语音大模型的应用结合</text>
  <text class="role r2" x="48" y="152">voice agents · 工具编排与权限沙箱</text>
  <text class="role r3" x="48" y="152">确定性会话重放 · 离线可复现评测</text>
  <text class="sub" x="48" y="196" style="fill:#5b667c">voxwright — 语音智能体应用层，植入真值合成场景，全离线</text>

  <g font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600">
    <rect x="48" y="222" width="74" height="24" rx="12" fill="#1a2130" stroke="#2b3648"/>
    <text x="85" y="238" fill="#a78bfa" text-anchor="middle">Python</text>
    <rect x="130" y="222" width="74" height="24" rx="12" fill="#1a2130" stroke="#2b3648"/>
    <text x="167" y="238" fill="#22d3ee" text-anchor="middle">NumPy</text>
    <rect x="212" y="222" width="90" height="24" rx="12" fill="#1a2130" stroke="#2b3648"/>
    <text x="257" y="238" fill="#a3e635" text-anchor="middle">PyTorch·CPU</text>
    <rect x="310" y="222" width="102" height="24" rx="12" fill="#1a2130" stroke="#2b3648"/>
    <text x="361" y="238" fill="#fbbf24" text-anchor="middle">offline-first</text>
  </g>

  <!-- right: voice → agent core → permission gate → tools -->
  <g>
    <!-- incoming waveform -->
    <path class="waveline" d="M470,140 q8,-26 16,0 t16,0 q8,-34 16,0 t16,0 q8,-20 16,0 t16,0 q8,-28 16,0"/>
    <text class="cap" x="470" y="182">speech in</text>
    <!-- wire to core -->
    <path class="wire" stroke="#22d3ee" d="M600,140 H646"/>
    <!-- agent core -->
    <circle class="halo" cx="676" cy="140" r="30" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <g class="core">
      <path d="M676,116 L697,128 L697,152 L676,164 L655,152 L655,128 Z" fill="#1d2436" stroke="#a78bfa" stroke-width="2.4"/>
      <circle cx="676" cy="140" r="6" fill="#a78bfa"/>
    </g>
    <text class="lbl" x="676" y="188">agent core</text>
    <!-- permission gate -->
    <path class="wire" stroke="#fbbf24" d="M700,140 H736"/>
    <g class="tool" style="animation-delay:1.2s">
      <path d="M748,128 l12,-5 l12,5 v9 c0,8 -5,13 -12,16 c-7,-3 -12,-8 -12,-16 Z" fill="#1d2436" stroke="#fbbf24" stroke-width="2"/>
      <path d="M754,140 l4,4 l7,-8" fill="none" stroke="#a3e635" stroke-width="2"/>
    </g>
    <text class="lbl" x="760" y="176">permission</text>
    <!-- fan out to tools -->
    <path class="wire" stroke="#a3e635" d="M778,132 C 800,120 806,96 820,88"/>
    <path class="wire" stroke="#a3e635" d="M780,140 H818" style="animation-delay:-0.7s"/>
    <path class="wire" stroke="#a3e635" d="M778,148 C 800,160 806,184 820,192" style="animation-delay:-1.4s"/>
    <g class="tool" style="animation-delay:1.6s">
      <rect x="822" y="72" width="34" height="30" rx="6" fill="#1d2436" stroke="#22d3ee" stroke-width="2"/>
      <line x1="828" y1="82" x2="850" y2="82" stroke="#22d3ee" stroke-width="2"/><line x1="828" y1="90" x2="844" y2="90" stroke="#22d3ee" stroke-width="2"/>
      <text class="lbl" x="839" y="118">日程</text>
    </g>
    <g class="tool" style="animation-delay:1.9s">
      <circle cx="839" cy="140" r="15" fill="#1d2436" stroke="#a78bfa" stroke-width="2"/>
      <path d="M835,146 v-10 l9,-3 v10" fill="none" stroke="#a78bfa" stroke-width="2"/><circle cx="834" cy="146" r="2.6" fill="#a78bfa"/><circle cx="843" cy="143" r="2.6" fill="#a78bfa"/>
      <text class="lbl" x="839" y="170">音乐</text>
    </g>
    <g class="tool" style="animation-delay:2.2s">
      <path d="M826,206 v-12 l13,-9 l13,9 v12 z" fill="#1d2436" stroke="#a3e635" stroke-width="2"/>
      <rect x="835" y="198" width="8" height="8" fill="#a3e635" opacity="0.8"/>
      <text class="lbl" x="839" y="226">家居</text>
    </g>
    <text class="cap" x="470" y="252">tool calls → side-effect ledger → verified response</text>
  </g>
</svg>
